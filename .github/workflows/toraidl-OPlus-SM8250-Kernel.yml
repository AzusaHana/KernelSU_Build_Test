name: Build toraidl stock OPlus SM8250 Kernel

on:
  workflow_dispatch:

env:
  TZ: Asia/Shanghai
  CLANG_VERSION: clang-r450784e
  CLANG_BRANCH: master-kernel-build-2022
  GCC_TAG: android-12.1.0_r27
  KERNEL_BRANCH: bpf-5.15-backport

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false

    steps:
    - uses: actions/checkout@v6

    - name: Remove unused packages
      uses: jlumbroso/free-disk-space@main
      with:
        preinstalled-runtimes: true
        android: false
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: false

    - name: Set swap to 10G
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 10
    
    - name: Setup build kernel environment
      run: |
        echo "BUILD_TIME=$(TZ=Asia/Shanghai date "+%y%m%d")" >> $GITHUB_ENV
        echo "BUILD_TIME_1=$(TZ=Asia/Shanghai date "+%Y-%m-%d")" >> $GITHUB_ENV
        sudo apt-get update
        sudo apt-get install -y \
          git ccache automake flex lzop bison gperf build-essential zip \
          curl zlib1g-dev g++-multilib bzip2 libbz2-dev liblz4-tool make \
          squashfs-tools dpkg-dev libssl-dev python3 bc libc6-dev-i386 libncurses5-dev \
          dwarves libelf-dev cmake gcc make libelf-dev libdw-dev libbpf-dev zlib1g-dev
        git clone https://git.kernel.org/pub/scm/devel/pahole/pahole.git
        cd pahole
        mkdir build && cd build
cmake -DCMAKE_BUILD_TYPE=RelWithDebInfo -D__LIB=lib ..
        make -j$(nproc)
        sudo make install
        pahole --version
        mkdir -p $GITHUB_WORKSPACE/kernel_workspace

    - name: Cache Clang toolchain
      id: cache-clang
      uses: actions/cache@v5
      with:
        path: ${{ github.workspace }}/kernel_workspace/clang-aosp
        key: ${{ env.CLANG_VERSION }}

    - name: Download & extract Clang-aosp (if cache miss)
      if: steps.cache-clang.outputs.cache-hit != 'true'
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        mkdir -p clang-aosp
        wget -O ${CLANG_VERSION}.tar.gz \
          https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/${CLANG_BRANCH}/${CLANG_VERSION}.tar.gz
        tar -C clang-aosp -zxvf ${CLANG_VERSION}.tar.gz

    - name: Cache GCC toolchain
      id: cache-gcc
      uses: actions/cache@v5
      with:
        path: ${{ github.workspace }}/kernel_workspace/gcc-64
        key: gcc-aarch64-${{ env.GCC_TAG }}

    - name: Download & extract Gcc-aosp
      if: steps.cache-gcc.outputs.cache-hit != 'true'
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        mkdir -p gcc-64
        wget -O gcc-aarch64.tar.gz \
          https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/tags/${GCC_TAG}.tar.gz
        tar -C gcc-64 -zxvf gcc-aarch64.tar.gz
    
    - name: Download kernel source
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        git clone --recursive https://github.com/toraidl/android_kernel_oneplus_sm8250 -b ${KERNEL_BRANCH} android-kernel

    - name: Revert KernelSU commit
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git revert --no-edit 9cc8986cd61645ea6af75599bb9814c8a8e0eef1
        git revert --no-edit b3bb82fdc68722de7148472c7deccb6ddae0500e
        git revert --no-edit 386fa8b6576780ac231229aa5ffba27904f6b98d
        git revert --no-edit f4805a01eb2ca795de4b75c4463e6af23eeea7c7
        git revert --no-edit 62ba12fc7dd1faea61a97066cbcc766ff8f7e3e4
        echo "CONFIG_TECHPACK_CAMERA_ONEPLUS=y" >> arch/arm64/configs/vendor/kona-perf_defconfig
        
    - name: Set up KernelSU
      run: |
        cd kernel_workspace/android-kernel
        curl -LSs https://raw.githubusercontent.com/backslashxx/KernelSU/master/kernel/setup.sh | bash -s master
        echo "CONFIG_KSU_HACK_ARM64_BRANCH_LINK=y" >> arch/arm64/configs/vendor/kona-perf_defconfig
        XXKSUVER=$(grep -oP 'KSU_VERSION\s*=\s*\K\d+' KernelSU/kernel/Makefile | tail -n1)
        echo "XXKSUVER=$XXKSUVER" >> $GITHUB_ENV

    - name: Build kernel
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        
        export ARCH=arm64
        export SUBARCH=arm64
        export BRAND_SHOW_FLAG=oneplus
        export PATH=$GITHUB_WORKSPACE/kernel_workspace/clang-aosp/bin:$GITHUB_WORKSPACE/kernel_workspace/gcc-64/bin:$PATH
        export KBUILD_BUILD_HOST=Github-Action
        export KBUILD_BUILD_USER=$(echo ${{ github.actor }} | tr A-Z a-z)
        
        BA_CMD="CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-android-"
        EX_CMD="LD=ld.lld LLVM=1 LLVM_IAS=1"
        
        DEFCONFIG="vendor/kona-perf_defconfig"
        
        make O=out ARCH=arm64 CC=clang $BA_CMD $EX_CMD $DEFCONFIG
        make -j$(nproc --all) O=out ARCH=arm64 CC=clang $BA_CMD $EX_CMD
    
    - name: Check kernel output
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel/out

        if [ -f arch/arm64/boot/Image ]; then
          echo "CHECK_IMAGE=true" >> $GITHUB_ENV
          echo "KERNEL_VERSION=$(cat include/config/kernel.release)" >> $GITHUB_ENV
        else
          echo "Kernel output file is empty"
          exit 1
        fi
      
    - name: Prepare AnyKernel3 and package
      run: |
        cd kernel_workspace
        git clone --depth=1 https://github.com/osm0sis/AnyKernel3
        sed -i 's/do.devicecheck=1/do.devicecheck=0/g' AnyKernel3/anykernel.sh
        sed -i 's!BLOCK=/dev/block/platform/omap/omap_hsmmc.0/by-name/boot;!BLOCK=auto;!g' AnyKernel3/anykernel.sh
        sed -i 's/IS_SLOT_DEVICE=0;/IS_SLOT_DEVICE=auto;/g' AnyKernel3/anykernel.sh
        rm -rf AnyKernel3/.git* AnyKernel3/README.md
        cp android-kernel/out/arch/arm64/boot/Image AnyKernel3/
        cp android-kernel/out/arch/arm64/boot/dtb AnyKernel3/
        cp android-kernel/out/arch/arm64/boot/dtbo.img AnyKernel3/

    - name: Upload Image
      uses: actions/upload-artifact@v7
      with:
        path: kernel_workspace/android-kernel/out/arch/arm64/boot/Image
        archive: false

    - name: Upload dtb
      uses: actions/upload-artifact@v7
      with:
        path: kernel_workspace/android-kernel/out/arch/arm64/boot/dtb
        archive: false

    - name: Upload dtbo.img
      uses: actions/upload-artifact@v7
      with:
        path: kernel_workspace/android-kernel/out/arch/arm64/boot/dtbo.img
        archive: false

    - name: Upload AnyKernel3
      uses: actions/upload-artifact@v7
      with:
        name: AK3-toraidl-OPlus-SM8250-backslashxx_KSU_${{ env.XXKSUVER }}.zip
        path: kernel_workspace/AnyKernel3/*
