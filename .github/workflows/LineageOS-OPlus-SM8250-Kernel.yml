name: Build LineageOS OPlus SM8250 Kernel

on:
  workflow_dispatch:

env:
  TZ: Asia/Shanghai
  CLANG_VERSION: clang-r547379
  Lineage_VERSION: lineage-24.0

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-latest

    outputs:
      ak3_artifact_id: ${{ steps.upload-ak3.outputs.artifact-id }}
      ak3_artifact_name: ${{ steps.metadata.outputs.ak3_artifact_name }}
      ksu_version: ${{ steps.metadata.outputs.ksu_version }}
      kernel_version: ${{ steps.metadata.outputs.kernel_version }}
      build_time: ${{ steps.metadata.outputs.build_time }}

    steps:
    - uses: actions/checkout@v6

    - name: Set swap to 10G
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 10

    - name: Setup build kernel environment
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git \
          ccache \
          automake \
          flex \
          lzop \
          bison \
          gperf \
          build-essential \
          curl \
          zlib1g-dev \
          g++-multilib \
          bzip2 \
          libbz2-dev \
          liblz4-tool \
          make \
          squashfs-tools \
          dpkg-dev \
          libssl-dev \
          python3 \
          bc \
          libc6-dev-i386 \
          libncurses5-dev

        mkdir -p "$GITHUB_WORKSPACE/kernel_workspace"

    - name: Cache Clang toolchain
      id: cache-clang
      uses: actions/cache@v5
      with:
        path: ${{ github.workspace }}/kernel_workspace/clang-aosp
        key: ${{ env.CLANG_VERSION }}

    - name: Download & extract Clang-aosp (if cache miss)
      if: steps.cache-clang.outputs.cache-hit != 'true'
      run: |
        cd "$GITHUB_WORKSPACE/kernel_workspace"

        mkdir -p clang-aosp

        wget -O "${CLANG_VERSION}.tar.gz" \
          "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/${CLANG_VERSION}.tar.gz"

        tar -C clang-aosp -zxvf "${CLANG_VERSION}.tar.gz"

        rm -f "${CLANG_VERSION}.tar.gz"

    - name: Download kernel source
      run: |
        cd "$GITHUB_WORKSPACE/kernel_workspace"

        git clone \
          --recursive \
          --depth=1 \
          -b "${{ env.Lineage_VERSION }}" \
          https://github.com/LineageOS/android_kernel_oneplus_sm8250 \
          android-kernel

    - name: Set up KernelSU (backslashxx)
      run: |
        cd "$GITHUB_WORKSPACE/kernel_workspace/android-kernel"

        curl -LSs \
          https://raw.githubusercontent.com/backslashxx/KernelSU/master/kernel/setup.sh \
          | bash -s master

        echo "CONFIG_KSU_HACK_ARM64_BRANCH_LINK=y" \
          >> arch/arm64/configs/vendor/kona-perf_defconfig

        sed -i 's/ -dirty//g' scripts/setlocalversion

    - name: Build kernel
      run: |
        cd kernel_workspace/android-kernel

        export ARCH=arm64
        export SUBARCH=arm64
        export PATH="$GITHUB_WORKSPACE/kernel_workspace/clang-aosp/bin:$PATH"
        export KBUILD_BUILD_HOST=Github-Action
        export KBUILD_BUILD_USER="$(echo "${{ github.actor }}" | tr '[:upper:]' '[:lower:]')"

        BA_CMD="CLANG_TRIPLE=aarch64-linux-gnu-"
        EX_CMD="LD=ld.lld LLVM=1"
        DEFCONFIG="vendor/kona-perf_defconfig vendor/oplus.config"

        make O=out CC=clang $BA_CMD $EX_CMD $DEFCONFIG
        make -j$(nproc --all) O=out CC=clang $BA_CMD $EX_CMD

    - name: Collect build metadata
      id: metadata
      run: |
        cd "$GITHUB_WORKSPACE/kernel_workspace/android-kernel"

        KSU_VERSION="$(grep -oP 'KSU_VERSION\s*=\s*\K\d+' KernelSU/kernel/Makefile | tail -n1)"
        KERNEL_VERSION="$(cat out/include/config/kernel.release)"
        BUILD_TIME="$(TZ=Asia/Shanghai date '+%Y-%m-%d')"
        AK3_ARTIFACT_NAME="AK3-${{ env.Lineage_VERSION }}-OPlus-SM8250-backslashxx_KSU_${KSU_VERSION}"

        echo "KSU_VERSION=$KSU_VERSION"
        echo "KERNEL_VERSION=$KERNEL_VERSION"
        echo "BUILD_TIME=$BUILD_TIME"
        echo "AK3_ARTIFACT_NAME=$AK3_ARTIFACT_NAME"

        echo "ksu_version=$KSU_VERSION" >> "$GITHUB_OUTPUT"
        echo "kernel_version=$KERNEL_VERSION" >> "$GITHUB_OUTPUT"
        echo "build_time=$BUILD_TIME" >> "$GITHUB_OUTPUT"
        echo "ak3_artifact_name=$AK3_ARTIFACT_NAME" >> "$GITHUB_OUTPUT"

    - name: Prepare AnyKernel3 and package
      run: |
        cd kernel_workspace
        git clone --depth=1 https://github.com/osm0sis/AnyKernel3
        sed -i 's/do.devicecheck=1/do.devicecheck=0/g' AnyKernel3/anykernel.sh
        sed -i 's!BLOCK=/dev/block/platform/omap/omap_hsmmc.0/by-name/boot;!BLOCK=auto;!g' AnyKernel3/anykernel.sh
        sed -i 's/IS_SLOT_DEVICE=0;/IS_SLOT_DEVICE=auto;/g' AnyKernel3/anykernel.sh
        rm -rf AnyKernel3/.git* AnyKernel3/README.md

        cp \
          android-kernel/out/arch/arm64/boot/Image \
          AnyKernel3/Image

    - name: Upload Image artifact
      uses: actions/upload-artifact@v7
      with:
        name: Image-backslashxx
        path: ${{ github.workspace }}/kernel_workspace/android-kernel/out/arch/arm64/boot/Image
        if-no-files-found: error

    - name: Upload AnyKernel3 artifact
      id: upload-ak3
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.metadata.outputs.ak3_artifact_name }}
        path: ${{ github.workspace }}/kernel_workspace/AnyKernel3/*
        if-no-files-found: error

  notify:
    name: Send AnyKernel3 to Telegram
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.result == 'success'

    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
      AK3_ARTIFACT_ID: ${{ needs.build.outputs.ak3_artifact_id }}
      AK3_ARTIFACT_NAME: ${{ needs.build.outputs.ak3_artifact_name }}
      KSU_VERSION: ${{ needs.build.outputs.ksu_version }}
      KERNEL_VERSION: ${{ needs.build.outputs.kernel_version }}
      BUILD_TIME: ${{ needs.build.outputs.build_time }}
  
    steps:
    - name: Download AnyKernel3 artifact
      run: |
        set -e

        OUTPUT="$RUNNER_TEMP/${AK3_ARTIFACT_NAME}.zip"

        if [ -z "${AK3_ARTIFACT_NAME}" ]; then
          echo "AK3_ARTIFACT_NAME is empty" >&2
          exit 1
        fi
        
        curl -fL \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer ${{ github.token }}" \
          -H "X-GitHub-Api-Version: 2026-03-10" \
          "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${AK3_ARTIFACT_ID}/zip" \
          -o "$OUTPUT"

        test -s "$OUTPUT"

        echo "AK3 artifact:"
        ls -lh "$OUTPUT"

        echo "AK3_ZIP=$OUTPUT" >> "$GITHUB_ENV"

    - name: Prepare Telegram media and send
      run: |
        set -e
        
        caption="\
        <blockquote><a href=\"https://github.com/backslashxx/KernelSU\"><b>Unofficial KernelSU (backslashxx)</b> - ${KSU_VERSION}</a></blockquote>
        Manager: <blockquote>https://github.com/backslashxx/KernelSU/releases</blockquote>

        ROM:<blockquote><b>${{ env.Lineage_VERSION }}</b></blockquote>
        Device:<blockquote>OnePlus 8 | OnePlus 8 Pro | OnePlus 8T | OnePlus 9R</blockquote>
        Kernel Version:<blockquote>${KERNEL_VERSION}</blockquote>
        Build Time:<blockquote>${BUILD_TIME}</blockquote>
        Change Log:<blockquote>Only Test.</blockquote>
        
        <a href=\"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\">Github Action</a>"

        media=$(jq -n \
            --arg media "attach://ak3" \
            --arg caption "$caption" \
            '[
              {
                type: "document",
                media: $media,
                caption: $caption,
                parse_mode: "HTML"
              }
            ]')

          curl -fS \
            "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMediaGroup" \
            -F "chat_id=${TELEGRAM_CHAT_ID}" \
            -F "media=${media}" \
            -F "ak3=@${AK3_ZIP};filename=${AK3_ARTIFACT_NAME}.zip"
